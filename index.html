const DB_NAME='EA_Academy_V21_Evidence';
const DB_VERSION=1;
const AUDIO_STORE='audio';

let audioDB=null;

function load(){
 try{
  const raw=JSON.parse(localStorage.getItem(KEY)||'{}');
  const d=defaultState();
  return {
   ...d,
   ...raw,
   profile:{...d.profile,...(raw.profile||{})},
   current:{...d.current,...(raw.current||{})},
   settings:{...d.settings,...(raw.settings||{})}
  };
 }catch(e){
  return defaultState();
 }
}

function save(){

}

function openAudioDB(){
 if(audioDB)return Promise.resolve(audioDB);

 return new Promise((resolve,reject)=>{
  const r=indexedDB.open(DB_NAME,DB_VERSION);

  r.onupgradeneeded=()=>{
   const db=r.result;
   if(!db.objectStoreNames.contains(AUDIO_STORE)){
    db.createObjectStore(AUDIO_STORE,{keyPath:'id'});
   }
  };

  r.onsuccess=()=>{
   audioDB=r.result;
   resolve(audioDB);
  };

  r.onerror=()=>reject(r.error);
 });
}

async function putAudio(id,blob){
 const db=await openAudioDB();

 return new Promise((resolve,reject)=>{
  const tx=db.transaction(AUDIO_STORE,'readwrite');
  tx.objectStore(AUDIO_STORE).put({
   id,
   blob,
   createdAt:new Date().toISOString()
  });
  tx.oncomplete=resolve;
  tx.onerror=()=>reject(tx.error);
 });
}

async function getAudio(id){
 const db=await openAudioDB();

 return new Promise((resolve,reject)=>{
  const tx=db.transaction(AUDIO_STORE,'readonly');
  const r=tx.objectStore(AUDIO_STORE).get(id);

  r.onsuccess=()=>{
   resolve(r.result?.blob||null);
  };

  r.onerror=()=>reject(r.error);
 });
}

async function hydrateAudioUrls(){
 for(const x of state.evidence.filter(e=>e.audioId)){
  if(x.audioUrl)continue;

  try{
   const blob=await getAudio(x.audioId);
   if(blob)x.audioUrl=URL.createObjectURL(blob);
  }catch(e){}
 }

 if(document.visibilityState!=='hidden'){
  renderAudioOnly();
 }
}

function renderAudioOnly(){
 const slots=document.querySelectorAll('[data-audio-id]');

 slots.forEach(el=>{
  const id=el.dataset.audioId;
  const item=state.evidence.find(x=>x.audioId===id);

  if(item?.audioUrl&&!el.src){
   el.src=item.audioUrl;
  }
 });
}

function esc(s){
 return String(s??'').replace(
  /[&<>'"]/g,
  m=>({
   '&':'&amp;',
   '<':'&lt;',
   '>':'&gt;',
   "'":'&#39;',
   '"':'&quot;'
  }[m])
 );
}

async function startRecording(){
 const status=document.getElementById('recStatus');

 try{

  if(
   !navigator.mediaDevices?.getUserMedia||
   !window.MediaRecorder
  ){
   throw new Error(
    'Voice recording is not supported by this browser'
   );
  }

  const stream=
   await navigator.mediaDevices.getUserMedia({
    audio:true
   });

  const mime=
   MediaRecorder.isTypeSupported('audio/webm')
   ?'audio/webm'
   :(MediaRecorder.isTypeSupported('audio/mp4')
     ?'audio/mp4'
     :'');

  recorder=
   new MediaRecorder(
    stream,
    mime?{mimeType:mime}:undefined
   );

  recordingChunks=[];

  recorder.ondataavailable=e=>{
   if(e.data.size){
    recordingChunks.push(e.data);
   }
  };

  recorder.onstop=async()=>{
   const blob=
    new Blob(
     recordingChunks,
     {type:mime||'audio/webm'}
    );

   const id=
    crypto.randomUUID
    ?crypto.randomUUID()
    :String(Date.now());

   try{

    await putAudio(id,blob);

    state.evidence.push({
     id,
     audioId:id,
     unitKey:unitKey(),
     subject:state.current.subject,
     week:state.current.week,
     topic:SUBJECTS[state.current.subject].weeks[state.current.week-1],

     learningOutcome:
      'Explain the weekly concept in your own words with an example and reasoning.',

     type:'Voice Learning Evidence v2.1',

     reflection:
      document.getElementById('voiceReflection')?.value||'',

     review:'Pending parent review',

     createdAt:new Date().toISOString(),

     status:masteryFor()
    });

    stream.getTracks().forEach(
     t=>t.stop()
    );

    save();

    document.getElementById('recStatus').textContent=
     'Saved permanently on this device in the Voice Evidence Engine.';

   }catch(e){

    document.getElementById('recStatus').textContent=
     'Recording captured but local evidence storage failed. Try again.';

    stream.getTracks().forEach(
     t=>t.stop()
    );
   }
  };

  recorder.start();

  status.textContent=
   'Recording… explain the idea, example and reasoning.';

 }catch(e){

  status.textContent=
   'Microphone unavailable or permission denied. You can still type learning evidence.';
 }
}

function exportData(){
 const clean=
  JSON.parse(
   JSON.stringify({
    ...state,
    evidence:state.evidence.map(
     x=>({...x,audioUrl:undefined})
    )
   })
  );

 const blob=
  new Blob(
   [JSON.stringify(clean,null,2)],
   {type:'application/json'}
  );

 const a=document.createElement('a');

 a.href=
  URL.createObjectURL(blob);

 a.download=
  'education-access-academy-v2.1-backup.json';

 a.click();

 URL.revokeObjectURL(a.href);
}

function importData(inp){
 const f=inp.files[0];

 if(!f)return;

 const r=new FileReader();

 r.onload=()=>{
  try{
   const incoming=
    JSON.parse(r.result);

   state=
    Object.assign(
     defaultState(),
     incoming
    );

   save();

   alert('Backup imported.');

  }catch(e){
   alert('Invalid backup file.');
  }
 };

 r.readAsText(f);
}

async function resetProgress(){

 if(
  confirm(
   'Reset learner progress on this device? This cannot be undone unless you have a backup.'
  )
 ){

  state=defaultState();

  localStorage.removeItem(KEY);

  try{

   const db=
    await openAudioDB();

   await new Promise(
    (resolve,reject)=>{
     const tx=
      db.transaction(
       AUDIO_STORE,
       'readwrite'
      );

     tx.objectStore(AUDIO_STORE).clear();

     tx.oncomplete=resolve;
     tx.onerror=()=>reject(tx.error);
    }
   );

  }catch(e){}

  save();
 }
}
