function openAudioDB(){
 if(audioDB)return Promise.resolve(audioDB);

 return new Promise((resolve,reject)=>{
  const r=indexedDB.open(DB_NAME,DB_VERSION);

  r.onupgradeneeded=()=>{
   const db=r.result;
   if(!db.objectStoreNames.contains(AUDIO_STORE)){
    db.createObjectStore(AUDIO_STORE,{keyPath:'id'});
   }
  };

  r.onsuccess=()=>{
   audioDB=r.result;
   resolve(audioDB);
  };

  r.onerror=()=>reject(r.error);
 });
}

async function putAudio(id,blob){
 const db=await openAudioDB();

 return new Promise((resolve,reject)=>{
  const tx=db.transaction(AUDIO_STORE,'readwrite');
  tx.objectStore(AUDIO_STORE).put({
   id,
   blob,
   createdAt:new Date().toISOString()
  });
  tx.oncomplete=resolve;
  tx.onerror=()=>reject(tx.error);
 });
}

async function getAudio(id){
 const db=await openAudioDB();

 return new Promise((resolve,reject)=>{
  const tx=db.transaction(AUDIO_STORE,'readonly');
  const r=tx.objectStore(AUDIO_STORE).get(id);

  r.onsuccess=()=>{
   resolve(r.result?.blob||null);
  };

  r.onerror=()=>reject(r.error);
 });
}

async function hydrateAudioUrls(){
 for(const x of state.evidence.filter(e=>e.audioId)){
  if(x.audioUrl)continue;

  try{
   const blob=await getAudio(x.audioId);
   if(blob)x.audioUrl=URL.createObjectURL(blob);
  }catch(e){}
 }

 if(document.visibilityState!=='hidden'){
  renderAudioOnly();
 }
}

function renderAudioOnly(){
 const slots=document.querySelectorAll('[data-audio-id]');

 slots.forEach(el=>{
  const id=el.dataset.audioId;
  const item=state.evidence.find(x=>x.audioId===id);

  if(item?.audioUrl&&!el.src){
   el.src=item.audioUrl;
  }
 });
}

function esc(s){
 return String(s??'').replace(
  /[&<>'"]/g,
  m=>({
   '&':'&amp;',
   '<':'&lt;',
   '>':'&gt;',
   "'":'&#39;',
   '"':'&quot;'
  }[m])
 );
}

function current(){
 return SUBJECTS[state.current.subject];
}

function unitKey(){
 return state.current.subject+'-'+state.current.week;
}

function done(k=unitKey()){
 return !!state.completed[k];
}

function evidenceFor(k=unitKey()){
 return state.evidence.filter(x=>x.unitKey===k);
}

function masteryFor(k=unitKey()){
 return state.mastery[k]||'Emerging';
}

function genericContent(s,w){
 const subj=SUBJECTS[s];
 const title=subj.weeks[w-1];

 const themes={
  mathematics:'Use mathematical language, relationships, quantities and logical reasoning in a real situation.',
  kiswahili:'Use Kiswahili accurately to listen, speak, read, analyse, write and revise.',
  english:'Use English to understand information and communicate clearly in speech and writing.',
  business:'Think like a young entrepreneur: identify needs, resources, value, costs and responsible decisions.',
  geography:'Connect people, place, environment, location and evidence through geographic thinking.',
  history:'Reason from evidence about people, time, place, change, causes, consequences and values.'
 };

 return {
  mission:themes[s],

  learn:`${title} is explored as an active learning investigation. Start with what you already know, connect the idea to everyday life, then explain it in your own words. Your goal is not to memorise a paragraph: it is to demonstrate understanding with evidence.`,

  try:`Find one real example connected to “${title}”. Write the example, identify the important information, and explain what the example teaches you.`,

  practice:[
   'Define the key idea in your own words.',
   'Give two examples from school, home or community.',
   'Create one question someone could ask about this topic.',
   'Solve, explain or demonstrate the question without copying a model answer.'
  ],

  voice:`In 45–90 seconds, teach one important idea from “${title}” as if you were helping a younger learner. State the idea, give an example, and explain why it matters.`,

  apply:`Create a small piece of evidence from your environment: a calculation, paragraph, map, business idea, historical explanation, comparison, observation or explanation appropriate to this subject.`
 };
}

function mathWeek1(){
 return {
  mission:
   'CONCEPT OF MATHEMATICS — Discover what mathematics is, why people use it, and how mathematical thinking helps us make decisions.',

  learn:
   `Mathematics is more than doing calculations. It is a way of thinking logically about numbers, quantities, patterns, relationships, shapes, measurements and situations.

   In this first unit, you will learn to recognise mathematics in ordinary life and explain why mathematical reasoning is useful.

   Mathematics helps us:
   • count and compare quantities;
   • measure length, time, mass and capacity;
   • calculate costs and change;
   • organise information;
   • recognise patterns and relationships;
   • estimate and check whether an answer makes sense;
   • solve problems systematically;
   • communicate reasoning clearly.

   A mathematical answer should not only tell us WHAT the answer is. Good mathematical thinking also explains HOW we obtained it and WHY the method makes sense.`,

  examples:[
   {
    title:'Example 1 — Shopping',
    problem:'Brielle has TZS 10,000. She buys bread for TZS 2,000 and milk for TZS 2,500. How much money remains?',
    working:[
     'Total money = TZS 10,000',
     'Money spent = TZS 2,000 + TZS 2,500',
     'Money spent = TZS 4,500',
     'Money remaining = TZS 10,000 − TZS 4,500',
     'Money remaining = TZS 5,500'
    ],
    reasoning:
     'Addition finds the total amount spent. Subtraction finds what remains after spending.'
   },

   {
    title:'Example 2 — Time',
    problem:'A lesson begins at 7:30 a.m. and lasts 45 minutes. When does it finish?',
    working:[
     'Starting time = 7:30 a.m.',
     '30 minutes after 7:30 = 8:00 a.m.',
     '15 more minutes = 8:15 a.m.'
    ],
    reasoning:
     'Time calculations require us to understand the relationship between hours and minutes.'
   },

   {
    title:'Example 3 — Sharing',
    problem:'A family has TZS 12,000 and shares it equally among 3 people. How much does each person receive?',
    working:[
     'Total = TZS 12,000',
     'Number of people = 3',
     'Each share = 12,000 ÷ 3',
     'Each person receives = TZS 4,000'
    ],
    reasoning:
     'Division is appropriate because one quantity is being shared equally.'
   },

   {
    title:'Example 4 — Checking an Answer',
    problem:'A learner calculates 398 + 205 and obtains 603. Is the answer reasonable?',
    working:[
     '398 is close to 400.',
     '205 is close to 200.',

     '603 is close to 600.'

    reasoning:

  ],

  guidedPractice:[
   {
    q:'A shopkeeper has TZS 20,000. A customer buys goods costing TZS 7,500. How much change should the customer receive?',
    answer:'TZS 12,500',
    method:'20,000 − 7,500 = 12,500'

   {
    q:'A water container holds 20 litres. It already contains 7 litres. How many more litres are needed to fill it?',
    answer:'13 litres',
    method:'20 − 7 = 13'
   },
   {
    q:'A journey starts at 9:15 a.m. and takes 1 hour 30 minutes. What time does it finish?',
    answer:'10:45 a.m.',
    method:'9:15 + 1 hour = 10:15; + 30 minutes = 10:45'
   }
  ],

  practice:[
   'Write five situations in which mathematics is used at home.',
   'A family spends TZS 8,500 on food and TZS 3,000 on transport. What is the total?',
   'A 24-metre rope is divided equally into 6 pieces. What is the length of each piece?',
   'A school has 240 exercise books and distributes them equally among 8 classes. How many books does each class receive?',
   'Create your own real-life mathematics problem and solve it.'
  ],

  challenge:
   `THE MATHEMATICS DETECTIVE CHALLENGE

   A shop has TZS 50,000 available to buy supplies.

function openEvidenceSubject(subject){
 state.current.subject=subject;
 save();
 go('evidence');
}

function openEvidenceUnit(key){
 if(!key)return;

 const parts=String(key).split('-');
 const subject=parts[0];
 const week=parseInt(parts[1],10);

 if(SUBJECTS[subject]){
   state.current.subject=subject;

   if(Number.isFinite(week)){
     state.current.week=week;
   }

   state.current.tab='mastery';

   save();
   go('curriculum');
 }
}

async function playEvidenceAudio(audioId){
 if(!audioId)return;

 const blob=await getAudio(audioId);

 if(!blob){
   alert('Voice evidence audio is not available.');
   return;
 }

 const url=URL.createObjectURL(blob);
 const audio=new Audio(url);

 audio.onended=()=>{
   URL.revokeObjectURL(url);
 };

 audio.play();
}

function reviewEvidenceFromEngine(id){
 const item=(state.evidence||[])
   .find(e=>String(e.id)===String(id));

 if(!item){
   alert('Evidence record not found.');
   return;
 }

 const review=prompt(
   'Enter parent/teacher review:',
   item.review||''
 );

 if(review===null)return;

 item.review=review.trim()||'Reviewed';
 item.reviewedAt=new Date().toISOString();

 save();
 render();
 }

       ${x.audioUrl?`src="${x.audioUrl}"`:''}
       data-audio-id="${esc(x.audioId)}">
      </audio>`
    :''
   }

   <p class="small">
    <b>Learner:</b>
    ${esc(x.reflection||'No reflection')}
   </p>

   <textarea
    id="review-${esc(x.id)}"
    rows="2"
    placeholder="Parent review / next-step feedback">${esc(x.review||'')}</textarea>

   <button
    class="btn primary"
    onclick="saveReview('${esc(x.id)}')">
    Save Parent Review
   </button>

  </div>`
 ).join('');

 return `
 <div class="grid">

  <div class="card span12">
   <h2>Parent Centre</h2>

   <p class="muted">
    Evidence-focused oversight for ${esc(state.profile.parentName)}.
    Review evidence, identify the next learning action,
    and avoid replacing learner reasoning with answers.
   </p>
  </div>

  <div class="card span12">
   <table class="table">

    <thead>
     <tr>
      <th>Subject</th>
      <th>Secure+</th>
      <th>Mastered</th>
      <th>Evidence</th>
     </tr>
    </thead>

    <tbody>
     ${rows}
    </tbody>

   </table>
  </div>

  <div class="card span12">
   <h3>Evidence Review Desk</h3>
   ${reviews||'<p class="muted">No evidence is ready for review yet.</p>'}
  </div>

  <div class="card span6">
   <h3>Parent Feedback Principle</h3>

   <p>
    Ask:
    “What information did you identify?”
    “What are you trying to find?”
    “Why did you choose that method?”
    before supplying the answer.
   </p>
  </div>

  <div class="card span6">
   <h3>Readiness Evidence</h3>
   <p>${readinessText()}</p>
  </div>

 </div>
 `;
}

function readinessText(){
 const secure=
  Object.values(state.mastery)
   .filter(x=>x==='Secure'||x==='Mastered')
   .length;

 const assessed=
  Object.keys(state.assessments).length;

 return `${secure} learning units have Secure/Mastered evidence and ${assessed} assessment result(s) are recorded. Readiness should be interpreted as a profile of evidence, not a single score.`;
}

function profilePage(){
 return `
 <div class="card">

  <h2>Learner & Programme Profile</h2>
  <div class="actions">

 <button
  class="btn primary"
  onclick="go('enrollment')">
  Enroll New Learner
 </button>

</div>
<div class="card" style="margin:12px 0;">

 <strong>Permanent Learner ID</strong>

 <div style="margin-top:6px;font-family:monospace;">
  ${esc(learnerProfile.learnerId)}
 </div>

 <small>
  This identifier remains associated with this learner profile.
 </small>

</div>
  <div class="grid">

   <label class="span6">
    Learner name
    <input id="pname" value="${esc(state.profile.learnerName)}">
   </label>

   <label class="span6">
    School
    <input id="pschool" value="${esc(state.profile.school)}">
   </label>

   <label class="span6">
    Level
    <input id="plevel" value="${esc(state.profile.level)}">
   </label>

   <label class="span6">
    Parent/Home teacher
    <input id="pparent" value="${esc(state.profile.parentName)}">
   </label>

   <label class="span6">
    Programme
    <input id="pprogramme" value="${esc(state.profile.programme)}">
   </label>

   <label class="span6">
    Goal
    <input id="pgoal" value="${esc(state.profile.goal)}">
   </label>

  </div>

  <div class="actions">

   <button class="btn primary" onclick="saveProfile()">
    Save Profile
   </button>

   <button class="btn blue" onclick="exportData()">
    Export JSON Backup
   </button>

   <button
    class="btn"
    onclick="document.getElementById('importFile').click()">
    Import JSON
   </button>

   <input
    id="importFile"
    class="hidden"
    type="file"
    accept="application/json"
    onchange="importData(this)">

   <button class="btn danger" onclick="resetProgress()">
    Reset Progress
   </button>

  </div>

 </div>
 `;
}

function go(p){
 state.page=p;
 render();
}

function setTab(t){
 state.current.tab=t;
 render();
}

function chooseSubject(s){
 state.current.subject=s;
 state.current.week=1;
 state.current.tab='discover';
 render();
}

function chooseWeek(w){
 state.current.week=+w;
 state.current.tab='discover';
 render();
}

function openUnit(s,w){
 state.page='curriculum';
 state.current={
  subject:s,
  week:w,
  tab:'discover'
 };
 render();
}

function saveDiscover(){
 const k=unitKey();

 state.flags[k]={
  ...(state.flags[k]||{}),
  discover:document.getElementById('discoverNote').value
 };

 save();

 alert('Starting evidence saved.');
}

function savePractice(){
 addEvidence(
  'Practice evidence',
  document.getElementById('practiceNote').value
 );

 alert('Practice evidence saved.');
}
function saveMood(mood){
  const reaction = document.getElementById("moodReaction");
  if(!reaction) return;

  const reactions = {
    "Great": {
      icon: "🎉",
      title: "That’s wonderful!",
      text: "You’re ready to learn, explore and do your best today."
    },
    "Good": {
      icon: "😊",
      title: "Nice!",
      text: "A positive start. Let’s make today a great learning session."
    },
    "Okay": {
      icon: "👍",
      title: "That’s okay.",
      text: "Every learning day is different. Let’s take it one step at a time."
    },
    "Not great": {
      icon: "😔",
      title: "Thank you for telling me.",
      text: "It’s okay not to feel your best. We can learn gently and take things one step at a time."
    }
  };

  const r = reactions[mood] || reactions["Okay"];

  reaction.innerHTML = `
    <div class="card" style="padding:14px;text-align:center;">
      <div style="font-size:42px;">${r.icon}</div>
      <div style="font-size:18px;font-weight:700;margin-top:6px;">${r.title}</div>
      <div class="muted" style="margin-top:5px;">${r.text}</div>
    </div>
  `;

  try{
    localStorage.setItem("EA_LEARNER_MOOD", mood);
  }catch(e){}
 }
function saveApply(){
 addEvidence(
  'Application evidence',
  document.getElementById('applyNote').value
 );

 alert('Application evidence saved.');
}

function saveCheck(){
 const ids=[
  ...document.querySelectorAll('.check textarea')
 ];

 state.checks[unitKey()]=Object.fromEntries(
  ids.map(x=>[x.id,x.value])
 );

 save();

 alert('Knowledge Check submitted.');
}

function saveJournal(){
 state.journals[unitKey()]={
  learned:document.getElementById('jl').value,
  difficult:document.getElementById('jd').value,
  explain:document.getElementById('je').value
 };

 save();

 alert('Journal evidence saved.');
}

function addEvidence(type,reflection){
 state.evidence.push({
  id:crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random(),
  unitKey:unitKey(),
  subject:state.current.subject,
  week:state.current.week,
  topic:SUBJECTS[state.current.subject].weeks[state.current.week-1],
  type,
  reflection,
  createdAt:new Date().toISOString(),
  status:masteryFor()
 });

 save();
}

async function startRecording(){
 const status=document.getElementById('recStatus');

 try{

  if(
   !navigator.mediaDevices?.getUserMedia||
   !window.MediaRecorder
  ){
   throw new Error(
    'Voice recording is not supported by this browser'
   );
  }

  const stream=
   await navigator.mediaDevices.getUserMedia({
    audio:true
   });

  const mime=
   MediaRecorder.isTypeSupported('audio/webm')
   ?'audio/webm'
   :(MediaRecorder.isTypeSupported('audio/mp4')
     ?'audio/mp4'
     :'');

  recorder=
   new MediaRecorder(
    stream,
    mime?{mimeType:mime}:undefined
   );

  recordingChunks=[];

  recorder.ondataavailable=e=>{
   if(e.data.size){
    recordingChunks.push(e.data);
   }
  };

  recorder.onstop=async()=>{
   const blob=
    new Blob(
     recordingChunks,
     {type:mime||'audio/webm'}
    );

   const id=
    crypto.randomUUID
    ?crypto.randomUUID()
    :String(Date.now());

   try{

    await putAudio(id,blob);

    state.evidence.push({
     id,
     audioId:id,
     unitKey:unitKey(),
     subject:state.current.subject,
     week:state.current.week,
     topic:SUBJECTS[state.current.subject].weeks[state.current.week-1],

     learningOutcome:
      'Explain the weekly concept in your own words with an example and reasoning.',

     type:'Voice Learning Evidence v2.1',

     reflection:
      document.getElementById('voiceReflection')?.value||'',

     review:'Pending parent review',

     createdAt:new Date().toISOString(),

     status:masteryFor()
    });

    stream.getTracks().forEach(
     t=>t.stop()
    );

    save();

    document.getElementById('recStatus').textContent=
     'Saved permanently on this device in the Voice Evidence Engine.';

   }catch(e){

    document.getElementById('recStatus').textContent=
     'Recording captured but local evidence storage failed. Try again.';

    stream.getTracks().forEach(
     t=>t.stop()
    );
   }
  };

  recorder.start();

  status.textContent=
   'Recording… explain the idea, example and reasoning.';

 }catch(e){

  status.textContent=
   'Microphone unavailable or permission denied. You can still type learning evidence.';
 }
}

function stopRecording(){
 if(
  recorder&&
  recorder.state!=='inactive'
 ){
  recorder.stop();
 }
}

function setMastery(v){
 state.mastery[unitKey()]=v;

 state.evidence.forEach(x=>{
  if(x.unitKey===unitKey()){
   x.status=v;
  }
 });

 save();
}

function saveReview(id){
 const el=document.getElementById('review-'+id);
 const x=state.evidence.find(e=>e.id===id);

 if(x&&el){
  x.review=el.value;
  x.reviewedAt=new Date().toISOString();

  save();

  alert('Parent review saved.');
 }
}

function completeUnit(){
 state.completed[unitKey()]=true;

 save();

 alert(
  'Unit marked complete. Continue building evidence rather than stopping at completion.'
 );
}

function saveAssessment(){
 const score=
  +document.getElementById('score').value;

 if(
  score<0||
  score>30||
  Number.isNaN(score)
 ){
  return alert(
   'Enter a score from 0 to 30.'
  );
 }

 state.assessments['mathematics-week1']={
  score,
  note:document.getElementById('assessNote').value,
  date:new Date().toISOString()
 };

 save();

 alert('Assessment result saved.');
}

function saveProfile(){
 state.profile={
  learnerName:document.getElementById('pname').value,
  school:document.getElementById('pschool').value,
  level:document.getElementById('plevel').value,
  parentName:document.getElementById('pparent').value,
  programme:document.getElementById('pprogramme').value,
  goal:document.getElementById('pgoal').value
 };

 save();

 alert('Profile saved.');
}

function exportData(){
 const clean=
  JSON.parse(
   JSON.stringify({
    ...state,
    evidence:state.evidence.map(
     x=>({...x,audioUrl:undefined})
    )
   })
  );

 const blob=
  new Blob(
   [JSON.stringify(clean,null,2)],
   {type:'application/json'}
  );

 const a=document.createElement('a');

 a.href=
  URL.createObjectURL(blob);

 a.download=
  'education-access-academy-v2.1-backup.json';

 a.click();

 URL.revokeObjectURL(a.href);
}

function importData(inp){
 const f=inp.files[0];

 if(!f)return;

 const r=new FileReader();

 r.onload=()=>{
  try{
   const incoming=
    JSON.parse(r.result);

   state=
    Object.assign(
     defaultState(),
     incoming
    );

   save();

   alert('Backup imported.');

  }catch(e){
   alert('Invalid backup file.');
  }
 };

 r.readAsText(f);
}

async function resetProgress(){

 if(
  confirm(
   'Reset learner progress on this device? This cannot be undone unless you have a backup.'
  )
 ){

  state=defaultState();

  localStorage.removeItem(KEY);

  try{

   const db=
    await openAudioDB();

   await new Promise(
    (resolve,reject)=>{
     const tx=
      db.transaction(
       AUDIO_STORE,
       'readwrite'
      );

     tx.objectStore(AUDIO_STORE).clear();

     tx.oncomplete=resolve;
     tx.onerror=()=>reject(tx.error);
    }
   );

  }catch(e){}

  save();
 }
}

state.page='dashboard';

render();

hydrateAudioUrls();

</script>
</body>
 </html>
